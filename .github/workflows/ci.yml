name: CI (tests + reglas)
on:
  push:
    branches-ignore: [data, pc]      # data: datos del recolector; pc: estado de la PC que publica el supervisor (G-8)
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {python: ["3.11", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Sobre de riesgo (línea base aprobada, solo paper)
        run: python tools/check_limits.py
      - name: Autoprueba de rutas protegidas
        run: python tools/protected_paths.py --self-test
      - name: Tests (incluye los de las reglas)
        run: python -m pytest
  windows:
    # La PC del dueño es Windows: los tests como los corre el supervisor (modo UTF-8), la sintaxis de los
    # scripts de PowerShell y el registro real de la tarea programada (sin iniciarla). Si esto no da verde,
    # la PC no toma la versión (G-7).
    runs-on: windows-latest
    timeout-minutes: 15
    env: {PYTHONUTF8: "1"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Tests en Windows
        run: python -m pytest -rfE
      - name: Sintaxis de los scripts (Windows PowerShell 5.1, la de la PC)
        shell: powershell
        run: |
          $mal = 0
          foreach ($f in Get-ChildItem deploy/windows/*.ps1) {
            $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errores) | Out-Null
            foreach ($e in $errores) { $mal++; Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
          }
          if ($mal) { exit 1 }
      - name: Registro real de la tarea trading-agente (sin iniciarla)
        shell: powershell
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -q -e .
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\instalar-agente.ps1 -Repo "$PWD" -SinIniciar
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = Get-ScheduledTask -TaskName trading-agente
          $t.Actions | Format-List Execute, Arguments, WorkingDirectory
          $t.Triggers | Format-List CimClass, Repetition
          $t.Settings | Format-List MultipleInstances, RestartCount, ExecutionTimeLimit
          if ($t.Actions[0].Arguments -ne "-m tradingagent supervisar") { Write-Host "accion equivocada"; exit 1 }
          if (-not ($t.Triggers | Where-Object { $_.Repetition.Interval -eq "PT1M" })) { Write-Host "falta el disparador de cada minuto"; exit 1 }
          if ($t.Settings.MultipleInstances -ne "IgnoreNew") { Write-Host "podrian correr dos"; exit 1 }
          $marca = Get-Content (Join-Path $env:LOCALAPPDATA "TRADING\state\tarea.json") -Raw | ConvertFrom-Json
          if (-not $marca.cada_minuto) { Write-Host "sin la marca de cada minuto el supervisor no se recarga"; exit 1 }
          Unregister-ScheduledTask -TaskName trading-agente -Confirm:$false
  protected-paths:
    # Rojo = el PR toca reglas, sobre de riesgo, núcleo de seguridad o CI: solo lo aprueba y fusiona el dueño.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0}
      - run: python tools/protected_paths.py origin/${{ github.base_ref }} HEAD
