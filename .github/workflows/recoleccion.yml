name: Recolector de entrenamiento
# Cada 15 min: lee las fuentes, guarda las noticias nuevas y etiqueta la reacción del precio con velas
# públicas (REGLAS G-6). Los datos van a la rama `data`, que es pública: solo datos públicos y ningún
# secreto. Sin claves de exchange (REGLAS G-1). Para pausarlo: Actions → este workflow → Disable.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: recoleccion, cancel-in-progress: false}
jobs:
  recolectar:
    if: github.repository == 'bbarrionuevo/Trading'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}          # solo para guardar en la rama data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e .              # editable, como el CI: lee config/limits.yaml del repo
      - name: Rama de datos
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch -q --depth=1 origin data:refs/remotes/origin/data
            git worktree add -q -B data "$RUNNER_TEMP/datos" origin/data
          else
            git worktree add -q --detach "$RUNNER_TEMP/datos"
            git -C "$RUNNER_TEMP/datos" checkout -q --orphan data
            git -C "$RUNNER_TEMP/datos" rm -rfq .
          fi
      - name: Recolectar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHARBIS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TRADING_HOME: ${{ runner.temp }}/trading-home
        run: python -m tradingagent collect --data "$RUNNER_TEMP/datos"
      - name: Guardar en la rama data
        working-directory: ${{ runner.temp }}/datos
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data
