name: Recolector de entrenamiento y paper
# Cada 5 min (REGLAS G-6): lee las fuentes, clasifica cada noticia (y le pregunta a Claude Haiku las
# dudosas), etiqueta la reacción del precio con velas públicas y opera en PAPER (dinero simulado contra
# libros reales) en Binance spot y en futuros de MEXC. Nunca hay órdenes reales: el código no las tiene.
# Los datos van a la rama `data`, que es pública: solo datos públicos y ningún secreto (REGLAS G-1).
# Para pausarlo: Actions → este workflow → Disable. Para frenar solo las entradas: un archivo KILL en `data`.
on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: recoleccion, cancel-in-progress: false}
jobs:
  recolectar:
    if: github.repository == 'bbarrionuevo/Trading'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}          # solo para guardar en la rama data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e .              # editable, como el CI: lee config/limits.yaml del repo
      - name: Rama de datos
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch -q --depth=1 origin data:refs/remotes/origin/data
            git worktree add -q -B data "$RUNNER_TEMP/datos" origin/data
          else
            git worktree add -q --detach "$RUNNER_TEMP/datos"
            git -C "$RUNNER_TEMP/datos" checkout -q --orphan data
            git -C "$RUNNER_TEMP/datos" rm -rfq .
          fi
      - name: Recolectar y operar en paper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHARBIS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          MEXC_ACCESS_KEY: ${{ secrets.ACCESS_KEY_MEXC }}
          MEXC_SECRET_KEY: ${{ secrets.SECRET_KEY_MEXC }}
          TRADING_HOME: ${{ runner.temp }}/trading-home
        run: python -m tradingagent collect --data "$RUNNER_TEMP/datos" --paper --capital 120
      - name: Guardar en la rama data
        working-directory: ${{ runner.temp }}/datos
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data
