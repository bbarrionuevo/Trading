# Agente de Tokio. Pisa los valores por defecto (src/tradingagent/config.py); lo demás, igual que en la PC.
# instalar-agente.sh lo copia a ~/.trading/config.yaml solo si no existe.
# Desde el 5-nov todo el agente corre en Tokio (la PC en "solo tablero"): el bot de Telegram (alertas, /pausa,
# /estado) también, así que las alertas van por Telegram como siempre (y además al tablero de la PC).
ingestion:
  sources:
    upbit.avisos:
      enabled: false   # el sitio de Upbit bloquea las IP de AWS (403): llega por el canal oficial de Telegram (relé)
    binance.listados:
      enabled: false   # la lee el relé y la reparte (una sola lectura por IP: el límite de www.binance.com es por IP)
