# SOBRE DE RIESGO (REGLAS A-1) · ruta protegida: solo el dueño aprueba y fusiona cambios a este archivo.
# Dentro de estos límites el agente decide solo. Bajarlos (más estricto) siempre está permitido; subirlos
# por encima de la línea base de src/tradingagent/limits.py lo rechazan el CI y el propio agente al arrancar.
# Derivados de los límites que el dueño aprobó para 100 € el 24-oct-2026, expresados en % del equity.
capital:
  todo_el_saldo: true           # SIN tope de capital (el dueño, 3-nov-2026: "elimina los topes, siempre se va a
                                # trabajar e invertir con todo el dinero disponible"): el real opera con todo el
                                # saldo de la cuenta de futuros y crece con él. Todo lo de abajo es % de ese saldo.
per_trade:
  max_risk_pct: 3.0             # pérdida al stop ≤ 3% del equity (el dueño, 4-nov-2026, con la simulación de la
                                # calibración: mes típico +8 %, caída máxima típica en un año ~10 %; antes 1 %)
  max_position_pct: 60          # nocional por activo ≤ 60% del equity (4-nov-2026: los resultados arriesgan el 3 %
                                # al stop de 5 %; cada estrategia tiene además su tope medido, policy.EXITS)
  max_leverage: 1               # sin apalancamiento (los perpetuos 1x permiten corto)
  max_slippage_bps: 200         # techo del tope de precio de toda orden (nunca a mercado sin tope). Cada estrategia
                                # usa el suyo, medido (policy.EXITS): los deslistados de Binance 2 % (el dueño, 7-nov:
                                # "tenes autorizacion para ensanchar"; con 0,5 % se llenaban 33 de 45), lo demás ≤ 0,5 %
  require_stop: true            # ninguna posición sin stop-loss
portfolio:
  max_gross_exposure_pct: 100   # suma de nocionales ≤ 100% del equity (1x: sin margen prestado)
  max_net_exposure_pct: 60      # |largos − cortos| ≤ 60% del equity (operaciones de minutos a días: el riesgo lo
                                # acota el stop de cada una, docs/ESTUDIO-APALANCAMIENTO.md)
  max_positions: 4
loss:
  daily_pct: 2.0                # circuit breaker: no abre más hasta 00:00 UTC
  weekly_pct: 4.0
  max_drawdown_pct: 8.0         # halt: solo vuelve con rearme humano
  max_consecutive_losses: 3
  cooldown_min: 60              # pausa después de las pérdidas seguidas
market:
  max_spread_bps: 30            # no entrar con spread mayor
  min_depth_multiple: 5         # profundidad dentro de 50 bps ≥ 5 × la orden
  max_book_age_s: 5
news:
  max_age_s: 600                # ninguna fuente opera noticias más viejas que esto
  min_sources_unverified: 2     # una fuente de nivel 3 necesita corroboración de otra fuente distinta
execution:
  max_orders_per_min: 30
ai:
  max_llm_usd_per_day: 5        # gasto diario máximo en modelos de lenguaje
